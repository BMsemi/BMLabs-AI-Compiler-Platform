services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bmlabs
      POSTGRES_USER: bmlabs
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U bmlabs]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, 'yes']
    volumes:
      - redis_data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  web:
    build: .
    env_file: .env
    environment:
      DJANGO_DEBUG: '0'
      DATABASE_URL: postgresql://bmlabs:${POSTGRES_PASSWORD}@db:5432/bmlabs
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      TRUST_PROXY: '1'
    volumes:
      - private_media:/app/private-media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    expose: ['8000']
  nginx:
    image: nginx:1.27-alpine
    ports:
      - '443:443'
      - '80:80'
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
    depends_on: [web]
    restart: unless-stopped
volumes:
  postgres_data:
  redis_data:
  private_media:
