openapi: 3.0.3
info:
  title: BM Labs Compiler Platform API
  version: 1.0.0
  description: Session-authenticated APIs. Bounded Linear int8 compilation through
    project builds. Unsafe requests require CSRF.
paths:
  /api/v1/artifacts/:
    get:
      operationId: v1_artifacts_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedArtifactList'
          description: ''
  /api/v1/artifacts/{id}/:
    get:
      operationId: v1_artifacts_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this artifact.
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Artifact'
          description: ''
  /api/v1/artifacts/{id}/download/:
    get:
      operationId: v1_artifacts_download_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this artifact.
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
          description: ''
  /api/v1/auth/{operation}/:
    get:
      operationId: v1_auth_retrieve
      parameters:
      - in: path
        name: operation
        schema:
          type: string
          enum:
          - session
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionInfo'
          description: ''
    post:
      operationId: v1_auth_create
      parameters:
      - in: path
        name: operation
        schema:
          type: string
          enum:
          - login
          - logout
          - password-reset
          - password-reset-confirm
          - register
          - resend
          - verify
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthInput'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AuthInput'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AuthInput'
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResult'
          description: ''
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResult'
          description: ''
        '400':
          description: No response body
        '403':
          description: No response body
        '429':
          description: No response body
